name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Inyectar variables de entorno
        run: cp ~/.env ./.env

      - name: Instalar dependencias
        run: composer install

      - name: Reiniciar servidor
        run: |
          setsid php artisan down && php artisan up && setsid php artisan serve &