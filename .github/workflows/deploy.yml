name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Inyectar variables de entorno y persistir almacenamiento
        run: |
          cp ~/.env ./.env
          mkdir -p ~/uploads/avatares ~/uploads/proyectos-terreno ~/uploads/emergencias ~/uploads/comprobantes-domicilio
          if [ -d "./public/uploads" ] && [ ! -L "./public/uploads" ]; then
            cp -rn ./public/uploads/* ~/uploads/ 2>/dev/null || true
            rm -rf ./public/uploads
          fi
          ln -sfn ~/uploads ./public/uploads

      - name: Instalar dependencias
        run: |
          source ~/.bashrc
          composer install
          npm install
          npm run build
          php artisan migrate --force
          php artisan storage:link || true
          php artisan app:mover-fotos-a-uploads || true
          php artisan optimize:clear
          php artisan view:clear
          php artisan config:clear
      
      - name: Reiniciar servidor
        run: |
          source ~/.bashrc
          pkill '^php' || true
          PHP_CLI_SERVER_WORKERS=5 setsid php artisan serve --port=443 --host=0.0.0.0 > storage/logs/server.log 2>&1 &