[program:vecindar-worker]
process_name=%(program_name)s
command=php /ruta/de/tu/proyecto/artisan queue:work database --sleep=3 --tries=3 --timeout=60 --max-time=3600
directory=/ruta/de/tu/proyecto
user=www-data
autostart=true
autorestart=true
startsecs=10
stopasgroup=true
killasgroup=true
stderr_logfile=/var/log/vecindar-worker.err.log
stdout_logfile=/var/log/vecindar-worker.out.log
