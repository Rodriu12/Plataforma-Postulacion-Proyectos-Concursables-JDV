services:
  app:
    build:
      context: .
      target: app
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_NAME: Vecindar
      APP_ENV: local
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: http://localhost:${APP_PORT:-8000}
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      APP_FAKER_LOCALE: es_CL
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-adminvecindar@gmail.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      LOG_CHANNEL: stack
      LOG_STACK: single
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DOCKER_DB_DATABASE:-vecindar}
      DB_USERNAME: ${DOCKER_DB_USERNAME:-vecindar}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-vecindar_local}
      SESSION_DRIVER: file
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          php -r '$$headers = get_headers("http://127.0.0.1/up");
          exit(isset($$headers[0]) && str_contains($$headers[0], "200") ? 0 : 1);'
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DOCKER_DB_DATABASE:-vecindar}
      MARIADB_USER: ${DOCKER_DB_USERNAME:-vecindar}
      MARIADB_PASSWORD: ${DOCKER_DB_PASSWORD:-vecindar_local}
      MARIADB_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-vecindar_root_local}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mariadb_data:
  app_storage:
